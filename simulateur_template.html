<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Simulateur d'évolutions FC 27</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f27;
    --panel-2: #23262f;
    --border: #2f333d;
    --text: #e8e9ec;
    --text-dim: #9aa0ab;
    --green: #3ecf6e;
    --yellow: #e8c547;
    --red: #e0554f;
    --accent: #ff6b35;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    position: relative;
  }
  select, input, button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
  }
  button {
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: var(--panel-2); }
  select { min-width: 320px; }
  input#playerSearch { min-width: 280px; }
  .search-wrap { position: relative; }
  #playerResults {
    position: absolute;
    top: 44px;
    left: 0;
    width: 320px;
    max-height: 320px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    z-index: 20;
    display: none;
  }
  #playerResults div {
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  #playerResults div:hover { background: var(--panel-2); }
  #playerResults .sub { color: var(--text-dim); font-size: 11px; }

  .evolved-filter {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .evolved-filter input { cursor: pointer; }

  .hint {
    color: var(--text-dim);
    font-size: 14px;
    padding: 20px;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }

  .chain-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .chain-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 8px 6px 14px;
    font-size: 13px;
  }
  .chain-chip .step-num {
    color: var(--accent);
    font-weight: bold;
  }
  .chain-chip button {
    border: none;
    background: var(--panel-2);
    color: var(--text-dim);
    border-radius: 50%;
    width: 20px;
    height: 20px;
    padding: 0;
    line-height: 1;
    font-size: 12px;
  }
  .chain-chip button:hover { color: var(--red); }

  .step {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .step-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
  }
  .step-header .step-num {
    background: var(--accent);
    color: #14161c;
    font-weight: bold;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 13px;
  }
  .step-header .step-name { font-size: 16px; font-weight: bold; }

  .banner {
    padding: 14px 18px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 16px;
  }
  .banner.ok { background: rgba(62,207,110,0.15); border: 1px solid var(--green); color: var(--green); }
  .banner.ko { background: rgba(224,85,79,0.15); border: 1px solid var(--red); color: var(--red); }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: rgba(62,207,110,0.15);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .banner ul { margin: 6px 0 0; padding-left: 18px; font-weight: normal; color: var(--text); }

  .evo-summary {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .evo-summary b { color: var(--text); }
  .evo-summary .cost { color: var(--accent); font-weight: bold; }

  .cards {
    display: grid;
    gap: 20px;
    grid-template-columns: 1fr 1fr;
  }
  .side-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .name-plate {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
  }
  .name-plate .ovr { font-size: 26px; font-weight: bold; }
  .name-plate .name { font-size: 16px; font-weight: bold; }
  .name-plate .pos { color: var(--text-dim); font-size: 13px; }

  .grid6 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  .box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .box .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .box .head .label { font-weight: bold; font-size: 13px; }
  .box .head .val { font-weight: bold; font-size: 16px; }
  .bar {
    height: 4px;
    background: #33363f;
    border-radius: 2px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .bar > div { height: 100%; }
  .sub-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    padding: 2px 0;
  }
  .sub-row .v { font-weight: bold; }
  .delta-up { color: var(--green); font-size: 10px; margin-left: 4px; }

  .info-card-wrap { margin-bottom: 14px; }
  .info-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .info-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    font-size: 12px;
  }
  .info-row-top { font-weight: bold; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
  .info-row-top .info-chip { color: var(--green); }
  .info-row-mid { color: var(--text-dim); padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
  .info-row-mid b { color: var(--text-dim); font-weight: bold; margin-right: 4px; }
  .stars { color: var(--yellow); letter-spacing: 1px; }
  .info-row-age { color: var(--text-dim); }
  .info-row-age b { color: var(--text-dim); margin-right: 4px; }

  .ps-icons-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .ps-name {
    font-size: 11px;
    font-weight: bold;
    padding: 3px 9px;
    border-radius: 12px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    background: var(--panel-2);
  }
  .ps-name.ps-plus { border-color: var(--accent); color: var(--accent); background: rgba(255,107,53,0.15); }
  .ps-name.ps-new { border-color: var(--green); color: var(--green); background: rgba(62,207,110,0.2); }

  @media (max-width: 900px) {
    .cards { grid-template-columns: 1fr; }
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: transparent;
    border: none;
    border-radius: 8px 8px 0 0;
    color: var(--text-dim);
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .tab-btn:hover { background: var(--panel-2); color: var(--text); }
  .tab-btn.active { color: var(--text); background: var(--panel); border: 1px solid var(--border); border-bottom-color: var(--panel); position: relative; top: 1px; }
  .view { display: none; }
  .view.active { display: block; }

  .history-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .history-count { color: var(--text-dim); font-size: 13px; }
  table.history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.history-table th, table.history-table td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  table.history-table th { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  table.history-table tbody tr:hover { background: var(--panel-2); }
  table.history-table .notes { color: var(--text-dim); }
  .undo-btn {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
  }
  .undo-btn:hover { background: rgba(224,85,79,0.15); }
  #toggleUnavailable:disabled { opacity: 0.45; cursor: not-allowed; }
  .choice-row { margin: 6px 0 10px; font-size: 13px; }
  .choice-row select { margin-left: 6px; max-width: 100%; }

  .player-link {
    background: transparent;
    border: none;
    color: var(--text);
    font-weight: bold;
    padding: 0;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: transparent;
  }
  .player-link:hover { background: transparent; color: var(--accent); text-decoration-color: var(--accent); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 640px;
    max-height: 100%;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .modal-header h2 { font-size: 17px; margin: 0; }
  .modal-close {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 50%;
    width: 30px;
    height: 30px;
    padding: 0;
    font-size: 15px;
    line-height: 1;
  }
  .modal-close:hover { color: var(--red); border-color: var(--red); }
  .modal-section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin: 20px 0 10px;
  }
  .evo-history-list { display: flex; flex-direction: column; gap: 8px; }
  .evo-history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .evo-history-item .evo-history-main { display: flex; flex-direction: column; gap: 2px; }
  .evo-history-item .evo-history-name { font-weight: bold; }
  .evo-history-item .evo-history-date { color: var(--text-dim); font-size: 12px; }
  .evo-history-item .evo-history-notes { color: var(--text-dim); font-size: 12px; }

  /* --- onglet Recherche --- */
  .search-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
  .search-filters label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .search-filters input, .search-filters select, .search-filters textarea { font-size: 13px; }
  .search-filters input[type=number] { width: 70px; }
  .search-filters textarea { width: 240px; height: 58px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; max-width: 220px; }
  .chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); font-size: 12px; text-transform: none; letter-spacing: 0; cursor: pointer; }
  .chip:hover { border-color: var(--red); }
  .search-evo-info { margin-bottom: 12px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
  .search-evo-info div { margin: 2px 0; }
  table.search-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.search-table th, table.search-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.search-table th { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--bg); }
  table.search-table tbody tr { cursor: pointer; }
  table.search-table tbody tr:hover { background: var(--panel-2); }
  .gain-pos { color: var(--green); font-weight: bold; }
  .search-missing { margin-top: 10px; color: var(--red); font-size: 13px; }
</style>
</head>
<body>

<h1>Simulateur de chaîne d'évolutions - EA SPORTS FC 27</h1>

<div class="tabs">
  <button type="button" class="tab-btn active" data-tab="simulateur">Simulateur</button>
  <button type="button" class="tab-btn" data-tab="search">Recherche</button>
  <button type="button" class="tab-btn" data-tab="history">Mes évolutions</button>
</div>

<div id="viewSimulateur" class="view active">
  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="playerSearch" placeholder="Tape un nom de joueur...">
      <div id="playerResults"></div>
    </div>
    <label class="evolved-filter" for="filterEvolvedOnly">
      <input type="checkbox" id="filterEvolvedOnly">
      Joueurs déjà évolués uniquement
    </label>
    <select id="evoSelect"><option value="">-- Ajouter une évolution à la chaîne --</option></select>
    <button id="toggleUnavailable" type="button" aria-pressed="false" title="Afficher ou masquer les évolutions épuisées ou expirées dans la liste">Afficher épuisées/expirées</button>
    <button id="clearChain" type="button">Vider la chaîne</button>
  </div>

  <div id="chainList" class="chain-list"></div>

  <div id="stepsContainer"></div>
</div>

<div id="viewSearch" class="view">
  <div class="search-filters">
    <label>Évolution (éligibilité)
      <select id="sEvo"><option value="">-- Toute la base --</option></select>
    </label>
    <label>Nom
      <input type="text" id="sName" placeholder="Nom du joueur">
    </label>
    <label>Liste de noms (un par ligne)
      <textarea id="sList" placeholder="Mbappé&#10;Lamine Yamal&#10;..."></textarea>
    </label>
    <label>Poste
      <select id="sPos"><option value="">Tous</option></select>
    </label>
    <label>Note min <input type="number" id="sMin" min="40" max="99"></label>
    <label>Note max <input type="number" id="sMax" min="40" max="99"></label>
    <label>Clubs <input type="text" id="sClub" list="dlClub" placeholder="Choisir (Entrée = ajouter)"><div class="chips" id="sClubChips"></div></label>
    <label>Ligues <input type="text" id="sLeague" list="dlLeague" placeholder="Choisir (Entrée = ajouter)"><div class="chips" id="sLeagueChips"></div></label>
    <label>Nations <input type="text" id="sNation" list="dlNation" placeholder="Choisir (Entrée = ajouter)"><div class="chips" id="sNationChips"></div></label>
    <label>Rareté
      <select id="sRarity"><option value="">Toutes</option></select>
    </label>
    <label class="evolved-filter" style="flex-direction:row;align-items:center;gap:6px;text-transform:none;font-size:13px">
      <input type="checkbox" id="sMine"> Mes joueurs évolués uniquement
    </label>
    <label class="evolved-filter" style="flex-direction:row;align-items:center;gap:6px;text-transform:none;font-size:13px" title="Remplace chaque carte évoluée par sa version après toutes tes évolutions enregistrées">
      <input type="checkbox" id="sEvolvedVersion"> Utiliser leur version évoluée
    </label>
    <button type="button" id="sReset">Réinitialiser</button>
    <button type="button" id="sCsv" title="Exporter le résultat affiché en CSV">Export CSV</button>
  </div>
  <datalist id="dlClub"></datalist><datalist id="dlLeague"></datalist><datalist id="dlNation"></datalist>
  <div id="sEvoInfo"></div>
  <div id="sCount" class="history-count" style="margin-bottom:8px"></div>
  <div id="sTable"></div>
  <div id="sMissing" class="search-missing"></div>
</div>

<div id="viewHistory" class="view">
  <div class="history-toolbar">
    <span id="historyCount" class="history-count"></span>
    <button id="refreshHistory" type="button">Rafraîchir</button>
  </div>
  <div id="historyContent"></div>
</div>

<div id="toast" class="toast"></div>

<div id="playerModalOverlay" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="playerModalTitle">Joueur</h2>
      <button type="button" id="playerModalClose" class="modal-close">✕</button>
    </div>
    <div id="playerModalStats"></div>
    <div class="modal-section-title">Évolutions réalisées</div>
    <div id="playerModalHistory"></div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/;

const CATEGORY_LABELS = { pace: "Pace", sho: "Shooting", pas: "Passing", dri: "Dribbling", def: "Defending", phy: "Physical" };
// Constantes de calcul exportees par evolution_report.js_constants() (une seule
// source de verite cote Python) : sous-stats, poids EA en pourcents, alias.
const META = DATA.meta;
const CATEGORY_SUBSTATS = META.categorySubstats;
const CATEGORY_WEIGHTS = META.categoryWeights;
const STAT_ALIASES = META.statAliases;
const DETAIL_LABEL_ALIASES = META.detailLabelAliases;

function statColor(v) {
  if (v >= 85) return "#3ecf6e";
  if (v >= 75) return "#8bd450";
  if (v >= 65) return "#e8c547";
  if (v >= 50) return "#e0954f";
  return "#e0554f";
}

function checkEligibility(p, req) {
  const reasons = [];
  const all = new Set([p.pos, ...p.alt]);
  if (req.overall_max !== undefined && p.ovr > req.overall_max) reasons.push(`Note ${p.ovr} > max ${req.overall_max}`);
  if (req.position_in) {
    const ok = req.position_in.some(pos => all.has(pos));
    if (!ok) reasons.push(`Poste (${[...all].join(", ")}) pas dans ${req.position_in.join(", ")}`);
  }
  if (req.position_excluded) {
    const bad = req.position_excluded.filter(pos => all.has(pos));
    if (bad.length) reasons.push(`Poste exclu présent : ${bad.join(", ")}`);
  }
  if (req.max_position_count !== undefined && (1 + p.alt.length) > req.max_position_count) {
    reasons.push(`Trop de postes (${1 + p.alt.length} > ${req.max_position_count})`);
  }
  if (req.pace_max !== undefined && (p.pace || 0) > req.pace_max) {
    reasons.push(`Vitesse ${p.pace} > max ${req.pace_max}`);
  }
  if (req.max_playstyles !== undefined) {
    const total = (p.psPlus || []).length + (p.psNormal || []).length;
    if (total > req.max_playstyles) reasons.push(`Trop de PlayStyles (${total} > ${req.max_playstyles})`);
  }
  return reasons;
}

function applyUpgrades(p, upgrades, grantedPlaystyles) {
  const detail = Object.assign({}, p.detail);
  const catDeltas = {};
  let overallDelta = 0;
  let wf = p.wf, sm = p.sm;
  const isGk = p.pos === "GK";

  for (const u of upgrades) {
    const stat = u.stat, delta = u.delta, cap = u.result_value;
    if (stat === "OVR") {
      // cumul : une evolution a paliers peut gagner de la note a plusieurs paliers
      const cur = p.ovr + overallDelta;
      let nv = cur + delta;
      if (cap !== null && cap !== undefined) nv = Math.max(cur, Math.min(nv, cap));
      overallDelta = nv - p.ovr;
      continue;
    }
    if (stat === "WF") {
      if (wf !== null && wf !== undefined) {
        let nv = wf + delta;
        wf = (cap !== null && cap !== undefined) ? Math.max(wf, Math.min(nv, cap)) : nv;
      }
      continue;
    }
    if (stat === "SM") {
      if (sm !== null && sm !== undefined) {
        let nv = sm + delta;
        sm = (cap !== null && cap !== undefined) ? Math.max(sm, Math.min(nv, cap)) : nv;
      }
      continue;
    }
    // GK : "POS" est la sous-stat Positioning du gardien ; aucune sous-stat
    // n'alimente les notes de champ (Reactions != Dribbling).
    const label = (isGk && stat === "POS") ? "Positioning" : (DETAIL_LABEL_ALIASES[stat] || stat);
    const category = isGk ? undefined : STAT_ALIASES[label];
    const current = detail[label];
    let cappedDelta = delta;
    if (typeof current === "number") {
      let nv = current + delta;
      if (cap !== null && cap !== undefined) nv = Math.max(current, Math.min(nv, cap));
      detail[label] = nv;
      cappedDelta = nv - current;
    }
    if (category) {
      catDeltas[category] = catDeltas[category] || {};
      catDeltas[category][label] = cappedDelta;
    }
  }

  if (isGk) {
    const acc = detail["Acceleration"], spr = detail["Sprint Speed"];
    if (typeof detail["Speed"] === "number" && typeof acc === "number" && typeof spr === "number") {
      const w = META.gkSpeedWeights;
      detail["Speed"] = Math.floor((w["Acceleration"] * acc + w["Sprint Speed"] * spr + 50) / 100);
    }
  }

  const after = Object.assign({}, p, { detail });
  after.ovr = p.ovr + overallDelta;
  after.wf = wf;
  after.sm = sm;
  for (const [field, touchedDeltas] of Object.entries(catDeltas)) {
    if (p[field] === null || p[field] === undefined) continue;
    const substats = CATEGORY_SUBSTATS[field] || [];
    const weights = CATEGORY_WEIGHTS[field];

    let weightedValue = null;
    if (weights && substats.length) {
      // poids en pourcents entiers + arrondi half-up (comme EA, verifie sur
      // ~17 700 cartes), en entiers pour eviter tout ecart de flottant.
      let total = 0;
      let ok = true;
      for (const s of substats) {
        const v = detail[s];
        if (typeof v !== "number") { ok = false; break; }
        total += (weights[s] || 0) * v;
      }
      if (ok) weightedValue = Math.floor((total + 50) / 100);
    }

    if (weightedValue !== null) {
      after[field] = weightedValue;
    } else if (substats.length) {
      // Repli si les sous-stats detaillees sont incompletes : moyenne sur
      // TOUTES les sous-stats de la categorie (0 pour celles non touchees par
      // l'evolution). Moins precis que le calcul pondere ci-dessus.
      const total = substats.reduce((sum, s) => sum + (touchedDeltas[s] || 0), 0);
      after[field] = p[field] + Math.round(total / substats.length);
    } else {
      const vals = Object.values(touchedDeltas);
      after[field] = p[field] + Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
    }
  }

  if (grantedPlaystyles && grantedPlaystyles.length) {
    const existing = new Set([...(p.psPlus || []), ...(p.psNormal || [])]);
    const newOnes = grantedPlaystyles.filter(ps => !existing.has(ps));
    after.psNormal = [...(p.psNormal || []), ...newOnes];
  }

  return after;
}

// Gains d'une evolution pour un nombre de paliers termines (null = tous) et les
// options choisies (1-based, une par palier). Meme regle que evo_levels.select_upgrades.
function evoGains(evo, levelsDone, choices) {
  if (!evo.levels) return { upgrades: evo.upgrades, playstyles: evo.grantedPlaystyles || [] };
  const upgrades = [], playstyles = [];
  evo.levels.forEach((lv, i) => {
    if (levelsDone !== null && levelsDone !== undefined && i >= levelsDone) return;
    const pick = (choices && Number.isInteger(choices[i])) ? choices[i] : 1;
    const opt = (pick >= 1 && pick <= lv.options.length) ? lv.options[pick - 1] : lv.options[0];
    upgrades.push(...opt.upgrades);
    for (const ps of opt.playstyles) if (!playstyles.includes(ps)) playstyles.push(ps);
  });
  return { upgrades, playstyles };
}
const defaultChoices = evo => (evo.levels || []).map(() => 1);

// Rejoue une evolution deja enregistree (paliers termines + choix) sur la carte.
function replayEntry(player, h) {
  const hEvo = DATA.evolutions.find(e => e.id === h.evolutionId);
  if (!hEvo) return null;
  const g = evoGains(hEvo, h.level, h.pathChoices);
  return applyUpgrades(player, g.upgrades, g.playstyles);
}

const QUALITY_COLORS = { GOLD: "#e8c547", SILVER: "#c7cdd6", BRONZE: "#c98a4b", SPECIAL: "#ff6b35" };

function cmToFeetInches(cm) {
  if (!cm) return "";
  const totalIn = cm / 2.54;
  const feet = Math.floor(totalIn / 12);
  const inches = Math.round(totalIn % 12);
  return `${feet}'${inches}"`;
}

function starRating(n) {
  n = n || 0;
  return "★".repeat(n) + "☆".repeat(Math.max(0, 5 - n));
}

function renderPlaystyleIcons(list, addedSet, className) {
  if (!list.length) return "";
  return list.map(name => {
    const isNew = addedSet && addedSet.has(name);
    return `<span class="ps-name ${className}${isNew ? " ps-new" : ""}">${name}${isNew ? " (nouveau)" : ""}</span>`;
  }).join("");
}

function renderInfoCard(player, before) {
  const beforePlus = before ? new Set(before.psPlus || []) : null;
  const beforeNormal = before ? new Set(before.psNormal || []) : null;
  const newPlus = beforePlus ? new Set((player.psPlus || []).filter(p => !beforePlus.has(p))) : null;
  const newNormal = beforeNormal ? new Set((player.psNormal || []).filter(p => !beforeNormal.has(p))) : null;
  const qColor = QUALITY_COLORS[player.quality] || "#e8e9ec";

  return `
    <div class="info-card">
      <div class="info-row info-row-top">
        <span class="info-chip">${player.nation || "-"}</span>
        <span class="info-chip">${player.league || "-"}</span>
        <span class="info-chip">${player.club || "-"}</span>
        <span class="info-chip" style="color:${qColor}">${player.quality || "-"}</span>
      </div>
      <div class="info-row info-row-mid">
        <span><b>SKILLS</b> <span class="stars">${starRating(player.sm)}</span></span>
        <span><b>WEAK FOOT</b> <span class="stars">${starRating(player.wf)}</span></span>
        <span><b>HEIGHT</b> ${player.height ? `${player.height}cm | ${cmToFeetInches(player.height)}` : "-"}</span>
        <span><b>FOOT</b> ${player.foot || "-"}</span>
      </div>
      <div class="info-row info-row-age"><b>AGE</b> ${player.age != null ? player.age + " ans" : "-"}</div>
      <div class="ps-icons-row">
        ${renderPlaystyleIcons(player.psPlus || [], newPlus, "ps-plus")}
        ${renderPlaystyleIcons(player.psNormal || [], newNormal, "ps-normal")}
      </div>
    </div>
  `;
}

function renderCard(container, plateEl, player, before) {
  plateEl.innerHTML = `
    <span class="ovr" style="color:${statColor(player.ovr)}">${player.ovr}</span>
    <span class="name">${esc(player.name)}</span>
    <span class="pos">${esc(player.pos)}${player.alt.length ? " / " + esc(player.alt.join(", ")) : ""}</span>
  `;
  const existingInfo = plateEl.nextElementSibling;
  if (existingInfo && existingInfo.classList.contains("info-card-wrap")) existingInfo.remove();
  const infoWrap = document.createElement("div");
  infoWrap.className = "info-card-wrap";
  infoWrap.innerHTML = renderInfoCard(player, before);
  plateEl.after(infoWrap);

  container.innerHTML = "";
  for (const spec of cardBoxes(player)) {
    const val = spec.get(player);
    if (val === undefined || val === null) continue;
    const box = document.createElement("div");
    box.className = "box";
    const beforeVal = before ? spec.get(before) : val;
    const deltaHtml = before && val !== beforeVal ? `<span class="delta-up">+${val - beforeVal}</span>` : "";
    let subsHtml = "";
    for (const label of spec.subs) {
      const v = player.detail[label];
      if (v === undefined) continue;
      const bv = before ? before.detail[label] : v;
      const d = before && v !== bv ? `<span class="delta-up">+${v - bv}</span>` : "";
      subsHtml += `<div class="sub-row"><span>${label}</span><span class="v" style="color:${statColor(v)}">${v}${d}</span></div>`;
    }
    box.innerHTML = `
      <div class="head">
        <span class="label">${spec.label}</span>
        <span class="val" style="color:${statColor(val)}">${val}${deltaHtml}</span>
      </div>
      <div class="bar"><div style="width:${val}%;background:${statColor(val)}"></div></div>
      ${subsHtml}
    `;
    container.appendChild(box);
  }
}

// Les 6 notes principales affichees : champ (PAC SHO PAS DRI DEF PHY) ou gardien
// (DIV HAN KIC REF SPD POS, lues dans les sous-stats detaillees).
function cardBoxes(player) {
  if (player.pos === "GK") {
    const extra = { SPD: ["Acceleration", "Sprint Speed"], REF: ["Reactions"] };
    return META.gkMains.map(([code, label]) => ({
      label: code, subs: extra[code] || [], get: pl => pl.detail[label],
    }));
  }
  return ["pace", "sho", "pas", "dri", "def", "phy"].map(cat => ({
    label: CATEGORY_LABELS[cat], subs: CATEGORY_SUBSTATS[cat], get: pl => pl[cat],
  }));
}

function formatCost(evo) {
  const bits = [];
  if (evo.coinCost) bits.push(`${evo.coinCost.toLocaleString("fr-FR")} pièces`);
  if (evo.pointCost) bits.push(`${evo.pointCost.toLocaleString("fr-FR")} FC Points`);
  return bits.length ? bits.join(" + ") : "Gratuite";
}

// Date de fin d'une evolution (evo.endTime, ISO UTC) : "15 nov. 2026 (dans 39 j)".
function formatEndTime(evo, withRelative = true) {
  if (!evo.endTime) return "date inconnue";
  const end = new Date(evo.endTime);
  if (isNaN(end.getTime())) return "date inconnue";
  const date = end.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
  if (!withRelative) return date;
  const days = Math.ceil((end.getTime() - Date.now()) / 86400000);
  if (days < 0) return `${date} (expirée)`;
  if (days === 0) return `${date} (aujourd'hui)`;
  return `${date} (dans ${days} j)`;
}

function formatReq(req) {
  const parts = [];
  if (req.overall_max !== undefined) parts.push(`Overall Max ${req.overall_max}`);
  if (req.position_in) parts.push(`Position ${req.position_in.join(", ")}`);
  if (req.position_excluded) parts.push(`Postes exclus : ${req.position_excluded.join(", ")}`);
  if (req.max_playstyles !== undefined) parts.push(`Max PS ${req.max_playstyles}`);
  if (req.pace_max !== undefined) parts.push(`Pace Max ${req.pace_max}`);
  if (req.max_position_count !== undefined) parts.push(`Max Pos. ${req.max_position_count}`);
  return parts.length ? parts.join(" &nbsp;|&nbsp; ") : "Aucune condition";
}

function formatUpgrades(upgrades, grantedPlaystyles) {
  const parts = upgrades.map(u => {
    const cap = (u.result_value !== null && u.result_value !== undefined) ? ` (max ${u.result_value})` : "";
    return `+${u.delta} ${u.stat}${cap}`;
  });
  if (grantedPlaystyles && grantedPlaystyles.length) {
    parts.push(`PlayStyle: ${grantedPlaystyles.join(", ")}`);
  }
  return parts.join(", ");
}

// --- wiring ---
const evoSelect = document.getElementById("evoSelect");
const playerSearch = document.getElementById("playerSearch");
const playerResults = document.getElementById("playerResults");
const filterEvolvedOnly = document.getElementById("filterEvolvedOnly");
const chainListEl = document.getElementById("chainList");
const stepsContainer = document.getElementById("stepsContainer");
const clearChainBtn = document.getElementById("clearChain");
const toggleUnavailableBtn = document.getElementById("toggleUnavailable");
const toastEl = document.getElementById("toast");

let toastTimer = null;
function showToast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3000);
}

// Par defaut le selecteur ne propose que les evolutions encore utilisables ;
// le bouton a cote remet les epuisees / expirees (utile pour rejouer un rattrapage).
// Echappe le texte venant de la base avant de l'injecter via innerHTML.
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let showUnavailableEvos = false;
const isEvoUnavailable = evo => evo.active === false || evo.remainingUses <= 0;

function rebuildEvoSelectOptions() {
  const previousValue = evoSelect.value;
  evoSelect.innerHTML = "";
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "-- Ajouter une évolution à la chaîne --";
  evoSelect.appendChild(placeholder);
  const hiddenCount = DATA.evolutions.filter(isEvoUnavailable).length;
  toggleUnavailableBtn.textContent = showUnavailableEvos
    ? "Masquer épuisées/expirées"
    : `Afficher épuisées/expirées (${hiddenCount})`;
  toggleUnavailableBtn.setAttribute("aria-pressed", String(showUnavailableEvos));
  toggleUnavailableBtn.disabled = hiddenCount === 0;
  for (const evo of DATA.evolutions) {
    if (!showUnavailableEvos && isEvoUnavailable(evo)) continue;
    const opt = document.createElement("option");
    opt.value = evo.id;
    const cost = formatCost(evo);
    let tag = cost !== "Gratuite" ? "  [PAYANTE]" : "";
    if (evo.active === false) {
      tag += "  [EXPIREE]";
    } else if (evo.remainingUses <= 0) {
      tag += `  [EPUISEE ${evo.usedCount}/${evo.repeatabilityCount}]`;
    } else if (evo.repeatabilityCount > 1) {
      tag += `  [${evo.remainingUses}/${evo.repeatabilityCount} restants]`;
    }
    opt.textContent = evo.name + tag;
    evoSelect.appendChild(opt);
  }
  evoSelect.value = previousValue;
}

let selectedPlayer = null;
let chain = []; // liste d'ids d'evolutions, dans l'ordre d'application
let chainChoices = []; // en parallele de chain : option (1-based) choisie a chaque palier
let currentMatches = [];

// Identifiant stable d'un joueur pour relier une carte de DATA.players a une
// entree d'historique (memes regles que sameHistoryPlayer/findPlayerData plus
// bas : eaId en priorite, nom en repli).
function playerIdentityKey(p) {
  return p.eaId ? `id:${p.eaId}` : (p.name ? `name:${p.name}` : null);
}
function historyEntryIdentityKey(e) {
  return e.playerEaId ? `id:${e.playerEaId}` : (e.playerName ? `name:${e.playerName}` : null);
}

let evolvedPlayerKeys = new Set();
function rebuildEvolvedPlayerKeys() {
  evolvedPlayerKeys = new Set();
  for (const e of historyEntries) {
    const key = historyEntryIdentityKey(e);
    if (key) evolvedPlayerKeys.add(key);
  }
}

function selectPlayer(p) {
  selectedPlayer = p;
  playerSearch.value = `${p.name} (${p.ovr} OVR, ${p.pos})`;
  playerResults.style.display = "none";
  render();
}

function updatePlayerResults() {
  const q = playerSearch.value.trim().toLowerCase();
  const onlyEvolved = filterEvolvedOnly.checked;
  if (q.length < 2 && !onlyEvolved) { playerResults.style.display = "none"; currentMatches = []; return; }
  currentMatches = [];
  for (const p of DATA.players) {
    if (onlyEvolved && !evolvedPlayerKeys.has(playerIdentityKey(p))) continue;
    if (q.length >= 2 && !(p.name && p.name.toLowerCase().includes(q))) continue;
    currentMatches.push(p);
    if (currentMatches.length >= 30) break;
  }
  playerResults.innerHTML = "";
  if (currentMatches.length === 0) {
    const div = document.createElement("div");
    div.className = "sub";
    div.textContent = onlyEvolved
      ? "Aucun joueur déjà évolué ne correspond."
      : "Aucun joueur trouvé pour cette recherche.";
    playerResults.appendChild(div);
  }
  for (const p of currentMatches) {
    const div = document.createElement("div");
    div.innerHTML = `${esc(p.name)} <span class="sub">(${esc(p.pos)}, ${p.ovr} OVR, ${esc(p.club || p.league || "")})</span>`;
    div.addEventListener("click", () => selectPlayer(p));
    playerResults.appendChild(div);
  }
  playerResults.style.display = "block";
  render();
}

playerSearch.addEventListener("input", () => {
  selectedPlayer = null; // on retape -> l'ancienne selection n'est plus valable tant qu'on n'en reprend pas une
  updatePlayerResults();
});

filterEvolvedOnly.addEventListener("change", () => {
  updatePlayerResults();
});

playerSearch.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !selectedPlayer && currentMatches.length > 0) {
    selectPlayer(currentMatches[0]);
  }
});

document.addEventListener("click", (e) => {
  if (!playerResults.contains(e.target) && e.target !== playerSearch) {
    playerResults.style.display = "none";
  }
});

evoSelect.addEventListener("change", () => {
  const evoId = parseInt(evoSelect.value, 10);
  if (!isNaN(evoId)) {
    chain.push(evoId);
    chainChoices.push(defaultChoices(DATA.evolutions.find(e => e.id === evoId) || {}));
    evoSelect.value = "";
    render();
  }
});

toggleUnavailableBtn.addEventListener("click", () => {
  showUnavailableEvos = !showUnavailableEvos;
  rebuildEvoSelectOptions();
});

clearChainBtn.addEventListener("click", () => {
  chain = [];
  chainChoices = [];
  render();
});

function removeStep(index) {
  chain.splice(index, 1);
  chainChoices.splice(index, 1);
  render();
}

async function recordEvolutionUsage(evoId, playerEaId, playerName, stepIndex, pathChoices, button, statusEl) {
  button.disabled = true;
  button.textContent = "Enregistrement…";
  statusEl.textContent = "";
  try {
    const res = await fetch("/api/record", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        evolutionId: evoId, playerEaId: playerEaId, playerName: playerName, notes: null,
        pathChoices: pathChoices && pathChoices.length ? pathChoices : null,
      }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      throw new Error(data.error || `HTTP ${res.status}`);
    }
    const evo = DATA.evolutions.find(e => e.id === evoId);
    if (evo) {
      evo.usedCount = data.usedCount;
      evo.remainingUses = data.remainingUses;
    }
    // L'etape est desormais dans l'historique (rejouee par render) : on la
    // retire de la chaine pour ne pas l'appliquer deux fois.
    chain.splice(stepIndex, 1);
    chainChoices.splice(stepIndex, 1);
    await loadHistoryEntriesSilently();
    rebuildEvoSelectOptions();
    if (filterEvolvedOnly.checked) updatePlayerResults();
    render();
    showToast(`✓ "${evo ? evo.name : "Évolution"}" enregistrée pour ${playerName}`);
  } catch (err) {
    statusEl.textContent = "Serveur local non disponible — lance record_server.py";
    button.disabled = false;
    button.textContent = "Enregistrer cette évolution";
  }
}

function renderChainChips() {
  chainListEl.innerHTML = "";
  chain.forEach((evoId, i) => {
    const evo = DATA.evolutions.find(e => e.id === evoId);
    const chip = document.createElement("div");
    chip.className = "chain-chip";
    chip.innerHTML = `<span class="step-num">${i + 1}.</span> ${evo ? esc(evo.name) : "?"} <button type="button">x</button>`;
    chip.querySelector("button").addEventListener("click", () => removeStep(i));
    chainListEl.appendChild(chip);
  });
}

// Une evolution Pathway propose, a certains paliers, plusieurs options dont on
// n'applique qu'une : un selecteur par palier concerne.
function optionSummary(opt) {
  const stats = opt.upgrades.map(u => `+${u.delta} ${u.stat}`).join(", ");
  const ps = opt.playstyles.length ? `PlayStyle ${opt.playstyles.join(", ")}` : "";
  return [stats, ps].filter(Boolean).join(" · ") || "aucun gain de stats";
}

function renderChoiceSelectors(step, evo, stepIndex) {
  (evo.levels || []).forEach((lv, li) => {
    if (lv.options.length < 2) return;
    const row = document.createElement("div");
    row.className = "choice-row";
    const label = document.createElement("label");
    label.textContent = `Palier ${li + 1} — option : `;
    const sel = document.createElement("select");
    lv.options.forEach((opt, oi) => {
      const o = document.createElement("option");
      o.value = String(oi + 1);
      o.textContent = `${String.fromCharCode(65 + oi)} — ${optionSummary(opt)}`;
      sel.appendChild(o);
    });
    sel.value = String(chainChoices[stepIndex][li] || 1);
    sel.addEventListener("change", () => {
      chainChoices[stepIndex][li] = parseInt(sel.value, 10);
      render();
    });
    label.appendChild(sel);
    row.appendChild(label);
    step.appendChild(row);
  });
}

function render() {
  renderChainChips();
  stepsContainer.innerHTML = "";

  if (!selectedPlayer || chain.length === 0) {
    const hint = document.createElement("div");
    hint.className = "hint";
    const missing = [];
    if (!selectedPlayer) missing.push("clique sur un joueur dans les résultats de recherche (ou appuie sur Entrée pour prendre le premier)");
    if (chain.length === 0) missing.push("ajoute au moins une évolution à la chaîne");
    hint.innerHTML = "Pour commencer : " + missing.join(" et ") + ".";
    stepsContainer.appendChild(hint);
    return;
  }

  // La chaine part de l'etat REEL du joueur : on rejoue d'abord, dans l'ordre
  // chronologique, les evolutions deja enregistrees pour lui (sinon la carte
  // de base est utilisee et la double evolution n'est jamais cumulee).
  let current = selectedPlayer;
  const selectedKey = playerIdentityKey(selectedPlayer);
  const alreadyApplied = historyEntries
    .filter(e => selectedKey && historyEntryIdentityKey(e) === selectedKey)
    .slice()
    .sort((a, b) => (a.dateApplied || "").localeCompare(b.dateApplied || "") || a.id - b.id);
  const appliedNames = [];
  for (const h of alreadyApplied) {
    const replayed = replayEntry(current, h);
    if (!replayed) { appliedNames.push(`${esc(h.evolutionName || "#" + h.evolutionId)} (données introuvables, non appliquée)`); continue; }
    current = replayed;
    const hEvo = DATA.evolutions.find(e => e.id === h.evolutionId);
    const progress = (h.level !== null && h.level !== undefined) ? ` (en cours ${h.level}/${h.maxLevel ?? "?"})` : "";
    appliedNames.push(esc(hEvo.name) + progress);
  }
  if (appliedNames.length) {
    const info = document.createElement("div");
    info.className = "hint";
    info.innerHTML = `<b>Déjà appliquées à ce joueur (cumulées avant la chaîne) :</b> ${appliedNames.join(" → ")}`;
    stepsContainer.appendChild(info);
  }

  chain.forEach((evoId, i) => {
    const evo = DATA.evolutions.find(e => e.id === evoId);
    if (!evo) return;

    const step = document.createElement("div");
    step.className = "step";

    const header = document.createElement("div");
    header.className = "step-header";
    header.innerHTML = `<span class="step-num">Étape ${i + 1}</span><span class="step-name">${esc(evo.name)}</span>`;
    const recordBtn = document.createElement("button");
    recordBtn.type = "button";
    recordBtn.textContent = "Enregistrer cette évolution";
    recordBtn.style.marginLeft = "auto";
    header.style.justifyContent = "space-between";
    header.appendChild(recordBtn);
    step.appendChild(header);

    const recordStatus = document.createElement("div");
    recordStatus.style.color = "var(--red)";
    recordStatus.style.fontSize = "12px";
    recordStatus.style.marginTop = "-8px";
    recordStatus.style.marginBottom = "14px";
    step.appendChild(recordStatus);

    const stepPlayerBefore = current;
    const gains = evoGains(evo, null, chainChoices[i]);
    recordBtn.addEventListener("click", () => {
      recordEvolutionUsage(evo.id, stepPlayerBefore.eaId, stepPlayerBefore.name, i, chainChoices[i], recordBtn, recordStatus);
    });

    const summary = document.createElement("div");
    summary.className = "evo-summary";
    const usageLine = evo.remainingUses <= 0
      ? `<div style="color:var(--red)"><b>⚠ Déjà épuisée :</b> ${evo.usedCount}/${evo.repeatabilityCount} usages enregistrés - simulation indicative</div>`
      : (evo.repeatabilityCount > 1 ? `<div><b>Usages restants :</b> ${evo.remainingUses}/${evo.repeatabilityCount}</div>` : "");
    summary.innerHTML = `
      <div><b>Coût :</b> <span class="cost">${formatCost(evo)}</span></div>
      <div><b>Conditions :</b> ${formatReq(evo.req)}</div>
      <div><b>Gains :</b> ${formatUpgrades(gains.upgrades, gains.playstyles)}</div>
      ${usageLine}
    `;
    step.appendChild(summary);
    renderChoiceSelectors(step, evo, i);

    const reasons = checkEligibility(current, evo.req);
    const banner = document.createElement("div");
    if (reasons.length) {
      banner.className = "banner ko";
      banner.innerHTML = "NON ÉLIGIBLE<ul>" + reasons.map(r => `<li>${r}</li>`).join("") + "</ul>";
    } else {
      banner.className = "banner ok";
      banner.innerHTML = "ÉLIGIBLE";
    }
    step.appendChild(banner);

    const after = applyUpgrades(current, gains.upgrades, gains.playstyles);

    const cards = document.createElement("div");
    cards.className = "cards";
    const beforeCol = document.createElement("div");
    beforeCol.innerHTML = `<div class="side-title">Avant l'étape ${i + 1}</div>
      <div class="name-plate" id="plateBefore${i}"></div><div class="grid6" id="gridBefore${i}"></div>`;
    const afterCol = document.createElement("div");
    afterCol.innerHTML = `<div class="side-title">Après l'étape ${i + 1}</div>
      <div class="name-plate" id="plateAfter${i}"></div><div class="grid6" id="gridAfter${i}"></div>`;
    cards.appendChild(beforeCol);
    cards.appendChild(afterCol);
    step.appendChild(cards);

    stepsContainer.appendChild(step);

    renderCard(document.getElementById(`gridBefore${i}`), document.getElementById(`plateBefore${i}`), current, null);
    renderCard(document.getElementById(`gridAfter${i}`), document.getElementById(`plateAfter${i}`), after, current);

    // L'etape suivante part de l'etat APRES celle-ci, meme si celle-ci
    // n'etait pas eligible (simulation "et si" indicative).
    current = after;
  });
}

async function mergeLiveUsage() {
  try {
    const res = await fetch("/api/usage", { signal: AbortSignal.timeout(1200) });
    if (!res.ok) return;
    const live = await res.json();
    const byId = new Map(live.map(e => [e.id, e]));
    for (const evo of DATA.evolutions) {
      const l = byId.get(evo.id);
      if (l) {
        evo.usedCount = l.usedCount;
        evo.remainingUses = l.remainingUses;
        if (typeof l.active === "boolean") evo.active = l.active;
      }
    }
  } catch (err) {
    // page ouverte en statique (file://) ou serveur non lance : on continue
    // avec le snapshot fige de DATA.evolutions, comportement inchange.
  }
}

// --- onglets ---
const tabBtns = document.querySelectorAll(".tab-btn");
const views = { simulateur: document.getElementById("viewSimulateur"), search: document.getElementById("viewSearch"), history: document.getElementById("viewHistory") };

tabBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    tabBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    for (const key in views) views[key].classList.remove("active");
    views[btn.dataset.tab].classList.add("active");
    if (btn.dataset.tab === "history") loadHistory();
    if (btn.dataset.tab === "search") loadHistoryEntriesSilently().then(runSearch);
  });
});

// --- recherche de joueurs (liste + eligibilite aux evolutions) ---
const SEARCH_LIMIT = 500;
const SEARCH_INPUT_IDS = ["sMine", "sEvolvedVersion", "sEvo", "sName", "sList", "sPos", "sMin", "sMax", "sClub", "sLeague", "sNation", "sRarity"];
const SEARCH_TEXT_COLS = ["name", "pos", "club", "league", "nation", "rarity"];
const sEl = id => document.getElementById(id);
const norm = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
let sSort = { key: null, dir: -1 };
let sRows = [];

// Clubs / ligues / nations : plusieurs valeurs choisies (puces, correspondance exacte) en plus
// du texte en cours de saisie (correspondance partielle). Un joueur passe s'il en matche une.
const MULTI_FILTERS = { sClub: "dlClub", sLeague: "dlLeague", sNation: "dlNation" };
const sChosen = { sClub: [], sLeague: [], sNation: [] };
const sKnown = { sClub: [], sLeague: [], sNation: [] };

function renderChips(id) {
  sEl(id + "Chips").innerHTML = sChosen[id]
    .map((v, i) => `<span class="chip" data-i="${i}" title="Retirer">${esc(v)} ×</span>`).join("");
}

// Transforme le texte saisi en puce s'il correspond exactement a une valeur connue.
function addChip(id) {
  const typed = norm(sEl(id).value);
  const value = typed && sKnown[id].find(v => norm(v) === typed);
  if (!value) return false;
  if (!sChosen[id].includes(value)) sChosen[id].push(value);
  sEl(id).value = "";
  renderChips(id);
  return true;
}

function multiMatcher(id) {
  const chosen = sChosen[id].map(norm), typed = norm(sEl(id).value);
  if (!chosen.length && !typed) return () => true;
  return v => { const n = norm(v); return chosen.includes(n) || (typed !== "" && n.includes(typed)); };
}

(function initSearch() {
  const uniq = f => [...new Set(DATA.players.map(p => p[f]).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const fill = (id, vals) => { sEl(id).innerHTML = vals.map(v => `<option value="${esc(v)}">`).join(""); };
  sKnown.sClub = uniq("club"); sKnown.sLeague = uniq("league"); sKnown.sNation = uniq("nation");
  fill("dlClub", sKnown.sClub); fill("dlLeague", sKnown.sLeague); fill("dlNation", sKnown.sNation);
  const addOpts = (id, vals) => {
    for (const v of vals) {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = v;
      sEl(id).appendChild(o);
    }
  };
  addOpts("sPos", [...new Set(DATA.players.flatMap(p => [p.pos, ...p.alt]).filter(Boolean))].sort());
  addOpts("sRarity", uniq("rarity"));
  // tri par date d'expiration croissante (la plus proche d'abord), dates inconnues a la fin
  const byEnd = e => e.endTime ? new Date(e.endTime).getTime() : Infinity;
  const searchEvos = DATA.evolutions.filter(e => !isEvoUnavailable(e)).sort((a, b) => {
    const x = byEnd(a), y = byEnd(b);
    return x === y ? 0 : x < y ? -1 : 1;
  });
  for (const evo of searchEvos) {
    const o = document.createElement("option");
    o.value = evo.id;
    o.textContent = evo.name + (formatCost(evo) !== "Gratuite" ? "  [PAYANTE]" : "") +
      (evo.endTime ? `  — fin ${formatEndTime(evo, false)}` : "");
    sEl("sEvo").appendChild(o);
  }
})();

// Evolutions enregistrees par joueur (cle = playerIdentityKey), triees par date.
function myEvolutionsByPlayer() {
  const map = new Map();
  for (const e of historyEntries) {
    const k = historyEntryIdentityKey(e);
    if (!k) continue;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(e);
  }
  for (const list of map.values()) {
    list.sort((a, b) => (a.dateApplied || "").localeCompare(b.dateApplied || "") || a.id - b.id);
  }
  return map;
}

function runSearch() {
  const myEvos = myEvolutionsByPlayer();
  const onlyMine = sEl("sMine").checked, useEvolved = sEl("sEvolvedVersion").checked;
  const evo = DATA.evolutions.find(e => String(e.id) === sEl("sEvo").value) || null;
  const gains = evo ? evoGains(evo, null, defaultChoices(evo)) : null;
  const nameQ = norm(sEl("sName").value);
  const listQ = sEl("sList").value.split(/[\n;,]+/).map(norm).filter(Boolean);
  const pos = sEl("sPos").value;
  const min = parseInt(sEl("sMin").value, 10), max = parseInt(sEl("sMax").value, 10);
  const matchClub = multiMatcher("sClub"), matchLeague = multiMatcher("sLeague"), matchNation = multiMatcher("sNation");
  const rarity = sEl("sRarity").value;

  const listHits = new Array(listQ.length).fill(0);
  const rows = [];
  for (const base of DATA.players) {
    const mine = myEvos.get(playerIdentityKey(base)) || [];
    if (onlyMine && !mine.length) continue;
    let p = base;
    if (useEvolved) for (const h of mine) p = replayEntry(p, h) || p;
    if (listQ.length) {
      const n = norm(p.name);
      let hit = false;
      listQ.forEach((q, i) => { if (n.includes(q)) { listHits[i]++; hit = true; } });
      if (!hit) continue;
    }
    if (nameQ && !norm(p.name).includes(nameQ)) continue;
    if (pos && p.pos !== pos && !p.alt.includes(pos)) continue;
    if (!isNaN(min) && p.ovr < min) continue;
    if (!isNaN(max) && p.ovr > max) continue;
    if (!matchClub(p.club) || !matchLeague(p.league) || !matchNation(p.nation)) continue;
    if (rarity && p.rarity !== rarity) continue;
    let after = null;
    if (evo) {
      if (checkEligibility(p, evo.req).length) continue;
      after = applyUpgrades(p, gains.upgrades, gains.playstyles);
    }
    rows.push({ p, base, after, gain: after ? after.ovr - p.ovr : 0, nbEvos: mine.length });
  }

  const key = sSort.key || (evo ? "gain" : "ovr");
  const dir = sSort.key ? sSort.dir : -1;
  const val = r => ({
    name: norm(r.p.name), pos: r.p.pos, ovr: r.p.ovr, final: r.after ? r.after.ovr : 0, gain: r.gain,
    club: norm(r.p.club), league: norm(r.p.league), nation: norm(r.p.nation), rarity: r.p.rarity || "",
    ps: (r.p.psPlus || []).length * 100 + (r.p.psNormal || []).length, evos: r.nbEvos,
  })[key];
  rows.sort((a, b) => {
    const x = val(a), y = val(b);
    return (x < y ? -1 : x > y ? 1 : 0) * dir || b.p.ovr - a.p.ovr;
  });
  sRows = rows;

  sEl("sEvoInfo").innerHTML = evo
    ? `<div class="search-evo-info"><div><b>${esc(evo.name)}</b> — ${formatCost(evo)}</div>
       <div><b>Expire le :</b> ${esc(formatEndTime(evo))}</div>
       <div><b>Conditions :</b> ${formatReq(evo.req)}</div>
       <div><b>Gains :</b> ${formatUpgrades(gains.upgrades, gains.playstyles)}</div></div>`
    : "";
  const cols = [["name", "Nom"], ["pos", "Poste"], ["ovr", "Note"]];
  if (evo) cols.push(["final", "Note finale"], ["gain", "Gain"]);
  cols.push(["club", "Club"], ["league", "Ligue"], ["nation", "Nation"], ["rarity", "Rareté"], ["ps", "PS+ / PS"], ["evos", "Mes évos"]);
  const shown = rows.slice(0, SEARCH_LIMIT);
  sEl("sCount").textContent = `${rows.length} joueur(s)` + (evo ? " éligible(s)" : "") +
    (rows.length > SEARCH_LIMIT ? ` — ${SEARCH_LIMIT} premiers affichés (affine les filtres)` : "");
  const head = cols.map(([k, l]) => `<th data-k="${k}">${l}${key === k ? (dir < 0 ? " ▼" : " ▲") : ""}</th>`).join("");
  const body = shown.map((r, i) => {
    const p = r.p;
    return `<tr data-i="${i}"><td>${esc(p.name)}</td><td>${esc(p.pos)}</td><td style="color:${statColor(p.ovr)}"><b>${p.ovr}</b></td>` +
      (evo ? `<td style="color:${statColor(r.after.ovr)}"><b>${r.after.ovr}</b></td><td class="${r.gain > 0 ? "gain-pos" : ""}">${r.gain > 0 ? "+" : ""}${r.gain}</td>` : "") +
      `<td>${esc(p.club)}</td><td>${esc(p.league)}</td><td>${esc(p.nation)}</td><td>${esc(p.rarity)}</td>` +
      `<td>${(p.psPlus || []).length} / ${(p.psNormal || []).length}</td><td>${r.nbEvos || ""}</td></tr>`;
  }).join("");
  sEl("sTable").innerHTML = `<table class="search-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  sEl("sMissing").textContent = listQ.length && listHits.some(h => h === 0)
    ? "Non trouvés : " + listQ.filter((_, i) => listHits[i] === 0).join(", ") : "";
}

sEl("sTable").addEventListener("click", e => {
  const th = e.target.closest("th");
  if (th) {
    const k = th.dataset.k;
    sSort = { key: k, dir: sSort.key === k ? -sSort.dir : (SEARCH_TEXT_COLS.includes(k) ? 1 : -1) };
    runSearch();
    return;
  }
  const tr = e.target.closest("tr[data-i]");
  if (!tr) return;
  // ouvre le joueur dans le simulateur, avec l'evolution filtree en chaine
  const r = sRows[parseInt(tr.dataset.i, 10)];
  const evo = DATA.evolutions.find(x => String(x.id) === sEl("sEvo").value);
  chain = evo ? [evo.id] : [];
  chainChoices = evo ? [defaultChoices(evo)] : [];
  selectPlayer(r.base);
  document.querySelector('.tab-btn[data-tab="simulateur"]').click();
});
for (const id of SEARCH_INPUT_IDS) {
  const evt = ["sEvo", "sPos", "sRarity"].includes(id) ? "change" : "input";
  sEl(id).addEventListener(evt, () => {
    if (id === "sEvo") sSort = { key: null, dir: -1 };
    runSearch();
  });
}
for (const id of Object.keys(MULTI_FILTERS)) {
  const input = sEl(id);
  // choix dans la liste deroulante (insertReplacementText), Entree, ou sortie du champ : ajoute la puce
  input.addEventListener("input", e => { if (e.inputType === "insertReplacementText" || !e.inputType) { if (addChip(id)) runSearch(); } });
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (addChip(id)) runSearch(); } });
  input.addEventListener("change", () => { if (addChip(id)) runSearch(); });
  sEl(id + "Chips").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    sChosen[id].splice(parseInt(chip.dataset.i, 10), 1);
    renderChips(id);
    runSearch();
  });
}
sEl("sReset").addEventListener("click", () => {
  for (const id of SEARCH_INPUT_IDS) sEl(id).value = "";
  for (const id of Object.keys(MULTI_FILTERS)) { sChosen[id] = []; renderChips(id); }
  sSort = { key: null, dir: -1 };
  runSearch();
});
sEl("sCsv").addEventListener("click", () => {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [["Nom", "Poste", "Note", "Note finale", "Gain", "Club", "Ligue", "Nation", "Rarete", "Mes evos"].join(";")];
  for (const r of sRows) {
    lines.push([r.p.name, r.p.pos, r.p.ovr, r.after ? r.after.ovr : "", r.after ? r.gain : "", r.p.club, r.p.league, r.p.nation, r.p.rarity, r.nbEvos].map(q).join(";"));
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" }));
  a.download = "recherche_joueurs.csv";
  a.click();
});

// --- historique ("mes évolutions") ---
const historyContent = document.getElementById("historyContent");
const historyCount = document.getElementById("historyCount");
const refreshHistoryBtn = document.getElementById("refreshHistory");
let historyEntries = [];

function formatDate(iso) {
  if (!iso) return "-";
  const d = new Date(iso.replace(" ", "T") + "Z");
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });
}

// Deux entrées d'historique concernent le meme joueur si elles partagent un
// eaId (identifiant fiable), sinon on retombe sur le nom (les enregistrements
// passes via record_evolution.py sans eaId n'ont que ca).
function sameHistoryPlayer(a, b) {
  if (a.playerEaId && b.playerEaId) return String(a.playerEaId) === String(b.playerEaId);
  return !!a.playerName && a.playerName === b.playerName;
}

function findPlayerData(entry) {
  if (entry.playerEaId) {
    const byEaId = DATA.players.find(p => p.eaId && String(p.eaId) === String(entry.playerEaId));
    if (byEaId) return byEaId;
  }
  return DATA.players.find(p => p.name === entry.playerName) || null;
}

// --- modal "stats du joueur + évolutions réalisées" ---
const playerModalOverlay = document.getElementById("playerModalOverlay");
const playerModalTitle = document.getElementById("playerModalTitle");
const playerModalStats = document.getElementById("playerModalStats");
const playerModalHistory = document.getElementById("playerModalHistory");
const playerModalClose = document.getElementById("playerModalClose");

function closePlayerModal() {
  playerModalOverlay.classList.remove("show");
}

function renderPlayerModalHistory(entry) {
  const related = historyEntries
    .filter(e => sameHistoryPlayer(e, entry))
    .slice()
    .sort((a, b) => (a.dateApplied || "").localeCompare(b.dateApplied || "") || a.id - b.id);

  playerModalHistory.innerHTML = "";
  if (!related.length) {
    playerModalHistory.innerHTML = `<div class="hint">Aucune évolution enregistrée pour ce joueur.</div>`;
    return;
  }
  const list = document.createElement("div");
  list.className = "evo-history-list";
  for (const e of related) {
    const item = document.createElement("div");
    item.className = "evo-history-item";
    item.innerHTML = `
      <div class="evo-history-main">
        <span class="evo-history-name">${esc(e.evolutionName || `#${e.evolutionId}`)}</span>
        <span class="evo-history-date">${formatDate(e.dateApplied)}</span>
        ${e.notes ? `<span class="evo-history-notes">${esc(e.notes)}</span>` : ""}
      </div>
    `;
    const undoBtn = document.createElement("button");
    undoBtn.type = "button";
    undoBtn.className = "undo-btn";
    undoBtn.textContent = "Annuler";
    undoBtn.addEventListener("click", async () => {
      await undoHistoryEntry(e.id, undoBtn);
      if (playerModalOverlay.classList.contains("show")) renderPlayerModalHistory(entry);
    });
    item.appendChild(undoBtn);
    list.appendChild(item);
  }
  playerModalHistory.appendChild(list);
}

// Carte du joueur telle qu'elle est APRES l'evolution `entry` : on rejoue, dans
// l'ordre chronologique, les evolutions enregistrees jusqu'a celle-ci incluse.
// Renvoie aussi l'etat juste avant pour afficher les gains.
function evolvedPlayerAt(entry, base) {
  const upTo = historyEntries
    .filter(e => sameHistoryPlayer(e, entry))
    .slice()
    .sort((a, b) => (a.dateApplied || "").localeCompare(b.dateApplied || "") || a.id - b.id);
  const idx = upTo.findIndex(e => e.id === entry.id);
  const applied = idx >= 0 ? upTo.slice(0, idx + 1) : [entry];
  let before = base;
  let after = base;
  for (const h of applied) {
    const replayed = replayEntry(after, h);
    if (!replayed) continue;
    before = after;
    after = replayed;
  }
  return { before, after };
}

function openPlayerModal(entry) {
  const player = findPlayerData(entry);
  playerModalTitle.textContent = entry.playerName || "Joueur";

  if (player) {
    const { before, after } = evolvedPlayerAt(entry, player);
    playerModalStats.innerHTML = `<div class="name-plate" id="modalPlate"></div><div class="grid6" id="modalGrid"></div>`;
    renderCard(document.getElementById("modalGrid"), document.getElementById("modalPlate"), after, before === after ? null : before);
  } else {
    playerModalStats.innerHTML = `<div class="hint">Ce joueur n'a pas été trouvé dans la base actuelle (carte peut-etre retirée) — seul l'historique des évolutions est disponible.</div>`;
  }

  renderPlayerModalHistory(entry);
  playerModalOverlay.classList.add("show");
}

playerModalClose.addEventListener("click", closePlayerModal);
playerModalOverlay.addEventListener("click", (e) => {
  if (e.target === playerModalOverlay) closePlayerModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && playerModalOverlay.classList.contains("show")) closePlayerModal();
});

async function undoHistoryEntry(id, button) {
  if (!confirm("Annuler cet enregistrement ?")) return;
  button.disabled = true;
  button.textContent = "…";
  try {
    const res = await fetch(`/api/history/${id}`, { method: "DELETE" });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
    showToast("✓ Enregistrement annulé");
    await loadHistory();
    // le quota de l'evolution annulee change : recharger les usages et reconstruire la liste
    await mergeLiveUsage();
    rebuildEvoSelectOptions();
    render();
  } catch (err) {
    button.disabled = false;
    button.textContent = "Annuler";
    showToast("Échec de l'annulation — serveur local non disponible ?");
  }
}

function renderHistory(entries) {
  if (!entries.length) {
    historyCount.textContent = "";
    historyContent.innerHTML = `<div class="hint">Aucune évolution enregistrée pour l'instant. Utilise le bouton "Enregistrer cette évolution" dans le simulateur, ou record_evolution.py.</div>`;
    return;
  }
  historyCount.textContent = `${entries.length} évolution${entries.length > 1 ? "s" : ""} enregistrée${entries.length > 1 ? "s" : ""}`;
  const table = document.createElement("table");
  table.className = "history-table";
  table.innerHTML = `
    <thead>
      <tr><th>Date</th><th>Évolution</th><th>Joueur</th><th>Notes</th><th></th></tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector("tbody");
  for (const e of entries) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${formatDate(e.dateApplied)}</td>
      <td>${esc(e.evolutionName || `#${e.evolutionId}`)}</td>
      <td></td>
      <td class="notes">${esc(e.notes || "-")}</td>
      <td></td>
    `;
    const playerCell = tr.children[2];
    if (e.playerName) {
      const playerBtn = document.createElement("button");
      playerBtn.type = "button";
      playerBtn.className = "player-link";
      playerBtn.textContent = e.playerName;
      playerBtn.title = "Voir les stats et l'historique de ce joueur";
      playerBtn.addEventListener("click", () => openPlayerModal(e));
      playerCell.appendChild(playerBtn);
    } else {
      playerCell.textContent = "-";
    }
    const undoBtn = document.createElement("button");
    undoBtn.type = "button";
    undoBtn.className = "undo-btn";
    undoBtn.textContent = "Annuler";
    undoBtn.addEventListener("click", () => undoHistoryEntry(e.id, undoBtn));
    tr.lastElementChild.appendChild(undoBtn);
    tbody.appendChild(tr);
  }
  historyContent.innerHTML = "";
  historyContent.appendChild(table);
}

async function loadHistory() {
  historyContent.innerHTML = `<div class="hint">Chargement…</div>`;
  historyCount.textContent = "";
  try {
    const res = await fetch("/api/history", { signal: AbortSignal.timeout(3000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const entries = await res.json();
    historyEntries = entries;
    rebuildEvolvedPlayerKeys();
    if (filterEvolvedOnly.checked) updatePlayerResults();
    renderHistory(entries);
  } catch (err) {
    historyContent.innerHTML = `<div class="hint">Serveur local non disponible — lance record_server.py pour voir ton historique d'évolutions.</div>`;
  }
}

refreshHistoryBtn.addEventListener("click", loadHistory);

// Charge l'historique en tache de fond des le demarrage (sans toucher a
// l'onglet "Mes evolutions") pour que le filtre "deja evolues" du Simulateur
// soit utilisable sans avoir a d'abord visiter cet onglet.
async function loadHistoryEntriesSilently() {
  try {
    const res = await fetch("/api/history", { signal: AbortSignal.timeout(1200) });
    if (!res.ok) return;
    historyEntries = await res.json();
    rebuildEvolvedPlayerKeys();
  } catch (err) {
    // serveur local non disponible : le filtre restera vide jusqu'a un chargement reussi
  }
}

async function init() {
  await mergeLiveUsage();
  await loadHistoryEntriesSilently();
  rebuildEvoSelectOptions();
  render();
}

init();
</script>
